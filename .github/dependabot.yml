#
# Dependabot configuration.
#
# Renovate (renovate.json) is the primary dependency manager for this repo:
# - Docker base images, PHP packages, Snipe-IT version pins.
#
# Dependabot covers GitHub Actions specifically as a belt-and-suspenders
# fallback against Renovate downtime / outage (Netresearch org convention).
# Docker is also included on a monthly cadence so a Renovate outage longer
# than a week still produces image-update PRs.
#
# Reference: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
---
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"
    # Minor + patch only. Major bumps are reviewed via Renovate (renovate.json
    # has matchUpdateTypes: ['major'] separated out for human approval).
    # Without this filter the first dependabot run produces a flood of major
    # bumps (cosign-installer v3→v4, codeql-action v3→v4, attest-build v2→v4,
    # etc.) — all of which need individual breaking-change review.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      actions-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "docker"
    labels:
      - "dependencies"
      - "docker"
    # Same rationale — major bumps reviewed via Renovate.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
