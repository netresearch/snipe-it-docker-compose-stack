#
# Static checks for the snipe-it-docker-compose-stack repo.
#
# Splits into:
#   - container-lint  → delegates Dockerfile (hadolint) + shellcheck on shipped
#                       scripts to netresearch/.github's reusable
#                       lint-container.yml. Pinned to the feature branch until
#                       PR netresearch/.github#141 merges; flip to @main then.
#   - compose-validate → stays inline. Validates docker compose config with
#                        repo-specific .env.example placeholder substitution
#                        (caller-specific shape that doesn't generalise).
#   - yamllint         → stays inline. The repo has no .yamllint.yml config
#                        file; rules are passed via config_data here to keep
#                        the contract local.

name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container-lint:
    # hadolint (always) + shellcheck (because shell-scandirs is set).
    uses: netresearch/.github/.github/workflows/lint-container.yml@feat/reusable-container-workflows
    permissions:
      contents: read
    with:
      shell-scandirs: ./rootfs/usr/local/bin ./bin

  compose-validate:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Validate compose.yml
        run: |
          cp .env.example .env
          # supply just-good-enough placeholders so validation passes
          sed -i \
            -e 's/^APP_KEY=$/APP_KEY=base64:CI_PLACEHOLDER_KEY_NOT_FOR_RUNTIME_USE_ONLY===/' \
            -e 's/^DB_PASSWORD=$/DB_PASSWORD=ci-placeholder/' \
            -e 's/^DB_ROOT_PASSWORD=$/DB_ROOT_PASSWORD=ci-placeholder/' \
            .env
          docker compose config --quiet
          docker compose -f compose.yml config --quiet

  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ibiqlik/action-yamllint@2576378a8e339169678f9939646ee3ee325e845c # v3
        with:
          file_or_dir: .github/workflows .hadolint.yaml compose.yml compose.override.yml.example examples/
          config_data: |
            extends: default
            rules:
              line-length: disable
              document-start: disable
              truthy:
                check-keys: false
              comments:
                min-spaces-from-content: 1
