name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hadolint:
    name: hadolint (Dockerfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      # hadolint/hadolint-action@v3.1.0 bundles hadolint v2.12.0 (Mar 2023),
      # which predates Docker 25's HEALTHCHECK --start-interval flag and
      # crashes with "invalid flag: --start-interval" on any Dockerfile
      # that uses it. Use `hadolint:latest-alpine` directly so we track
      # current hadolint releases (the action wraps the same image but
      # version-pinned to whenever the action shipped).
      - name: hadolint (via latest-alpine image)
        run: |
          docker run --rm -i \
            -v "${{ github.workspace }}/.hadolint.yaml:/.config/hadolint.yaml:ro" \
            hadolint/hadolint:latest-alpine \
            hadolint --config /.config/hadolint.yaml --failure-threshold warning - \
            < Dockerfile

  compose-validate:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Validate compose.yml
        run: |
          cp .env.example .env
          # supply just-good-enough placeholders so validation passes
          sed -i \
            -e 's/^APP_KEY=$/APP_KEY=base64:CI_PLACEHOLDER_KEY_NOT_FOR_RUNTIME_USE_ONLY===/' \
            -e 's/^DB_PASSWORD=$/DB_PASSWORD=ci-placeholder/' \
            -e 's/^DB_ROOT_PASSWORD=$/DB_ROOT_PASSWORD=ci-placeholder/' \
            .env
          docker compose config --quiet
          docker compose -f compose.yml config --quiet

  shellcheck:
    name: shellcheck (entrypoint + scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: ./rootfs/usr/local/bin ./bin

  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: ibiqlik/action-yamllint@2576378a8e339169678f9939646ee3ee325e845c # v3
        with:
          file_or_dir: .github/workflows .hadolint.yaml compose.yml compose.override.yml.example examples/
          config_data: |
            extends: default
            rules:
              line-length: disable
              document-start: disable
              truthy:
                check-keys: false
              comments:
                min-spaces-from-content: 1
