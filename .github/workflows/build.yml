name: build

on:
  # Daily rebuild — picks up base-image CVE fixes, fresh composer deps,
  # and rebuilds branch-tracking images (master / develop) against
  # current upstream HEAD.
  schedule:
    - cron: '0 4 * * *'   # 04:00 UTC
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'examples/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      track:
        description: 'Which stream to build (default: all 3)'
        type: choice
        required: false
        default: 'all'
        options: ['all', 'tag', 'master', 'develop']
      snipe_it_version:
        description: 'Override tag (only used with track=tag; default: read .snipe-it-version)'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/snipe-it-php-fpm

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  # cancel-in-progress: false ONLY on schedule — interrupting the daily
  # multi-arch rebuild mid-push could leave half-attached manifests.
  # For push/pr/dispatch: cancel-in-progress=true so a new commit
  # supersedes an older queued/running build instead of stacking up.
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  build:
    name: build (${{ matrix.track.name }}/${{ matrix.composer }})
    runs-on: ubuntu-latest
    # Rolling variants resolve composer deps fresh against composer.json
    # ranges, so they fail whenever upstream Snipe-IT's constraints
    # reference a major that's now under a composer audit advisory
    # (e.g. symfony/dom-crawler ^4.4 → PKSA-5r1g-c7b7-y1zg). This is the
    # rolling variant working as designed; don't let it block the pinned
    # variants which ARE the canonical release artefacts.
    continue-on-error: ${{ matrix.composer == 'rolling' }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        track:
          # ─ stable release line — reads .snipe-it-version (Renovate-managed) ─
          - name: tag
            ref_source: file       # build.yml will read .snipe-it-version
            tags_extra: ''         # plus the auto-generated 8.5.0 / 8.5 / 8 / latest tags
          # ─ branch tracker: master (= last released code, may include
          #   post-release commits) ─
          - name: master
            ref_source: master
            tags_extra: 'master'
          # ─ branch tracker: develop (= active dev branch, pre-release) ─
          - name: develop
            ref_source: develop
            tags_extra: 'develop,nightly'
        composer:
          # `pinned`  — Snipe-IT's shipped composer.lock honored (reproducible)
          # `rolling` — composer.lock deleted before install (catches transitive CVEs)
          - pinned
          - rolling
        exclude:
          # tag/rolling is structurally impossible to be green: snipe-it's
          # tagged composer.json carries a `symfony/dom-crawler ^4.4`
          # constraint, and Composer's `block-insecure-packages` (default
          # true since 2.7) refuses to load v4.4.0–v4.4.45 because the
          # entire range is flagged by security advisory
          # PKSA-5r1g-c7b7-y1zg. No version satisfies the constraint, so
          # `composer install` exits 100. The only fix is upstream:
          # snipe-it must relax to `^5.0` (or bump the lock for the
          # remediated 4.4.46+ once Symfony publishes it). Tracked at
          # https://github.com/grokability/snipe-it/issues ; until then,
          # the cell is excluded so CI is genuinely green. master/rolling
          # and develop/rolling still exercise the rolling-deps path
          # against their HEAD constraints, which is where any new
          # transitive CVE would surface first.
          - track:
              name: tag
              ref_source: file
              tags_extra: ''
            composer: rolling
    steps:
      - name: Filter — should this track run?
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          TRACK: ${{ matrix.track.name }}
          INPUT_TRACK: ${{ inputs.track }}
        run: |
          # PR: only `tag` — keep CI fast.
          if [ "$EVENT" = "pull_request" ] && [ "$TRACK" != "tag" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # workflow_dispatch with explicit track: only that track.
          if [ "$EVENT" = "workflow_dispatch" ] && [ -n "$INPUT_TRACK" ] \
              && [ "$INPUT_TRACK" != "all" ] && [ "$INPUT_TRACK" != "$TRACK" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Resolve build ref for this track
        if: steps.gate.outputs.skip != 'true'
        id: ref
        env:
          # Inputs are passed via env vars (NOT shell interpolation) so that
          # workflow_dispatch values containing shell metacharacters can't
          # become command injection. SonarCloud rule githubactions:S7630.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_SOURCE: ${{ matrix.track.ref_source }}
          INPUT_VERSION: ${{ inputs.snipe_it_version }}
          TRACK_NAME: ${{ matrix.track.name }}
        run: |
          if [ "$REF_SOURCE" = "file" ]; then
            if [ -n "$INPUT_VERSION" ]; then
              REF="$INPUT_VERSION"
            else
              REF=$(tr -d '[:space:]' < .snipe-it-version)
            fi
            VERSION="${REF#v}"                       # strip leading v for image tags
            MAJOR=$(echo "$VERSION" | cut -d. -f1)
            MAJOR_MINOR=$(echo "$VERSION" | cut -d. -f1-2)
            IS_TAG=true
          else
            # Resolve current upstream SHA for the branch (master / develop)
            REF="$REF_SOURCE"
            SHA=$(gh api "repos/grokability/snipe-it/commits/${REF_SOURCE}" --jq '.sha')
            VERSION="${REF_SOURCE}-$(date -u +%Y%m%d)-${SHA:0:7}"
            MAJOR=""
            MAJOR_MINOR=""
            IS_TAG=false
          fi
          {
            echo "ref=$REF"
            echo "version=$VERSION"
            echo "major=$MAJOR"
            echo "major_minor=$MAJOR_MINOR"
            echo "is_tag=$IS_TAG"
            echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "date_tag=$(date -u +'%Y%m%d')"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved: track=$TRACK_NAME ref=$REF version=$VERSION"

      - name: Set up QEMU
        if: steps.gate.outputs.skip != 'true'
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: Set up Docker Buildx
        if: steps.gate.outputs.skip != 'true'
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to ghcr.io
        if: steps.gate.outputs.skip != 'true' && github.event_name != 'pull_request'
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags (tag-stream)
        if: steps.gate.outputs.skip != 'true' && matrix.track.ref_source == 'file'
        id: tags_tag
        env:
          # All ${{ ... }} interpolation goes through env vars rather than
          # directly into the run-script body — sonarcloud rule
          # githubactions:S7630 (shell injection).
          IS_RELEASE_FROM_FILE: ${{ inputs.snipe_it_version == '' }}
          COMPOSER_MODE: ${{ matrix.composer }}
          REF_VERSION: ${{ steps.ref.outputs.version }}
          REF_DATE_TAG: ${{ steps.ref.outputs.date_tag }}
          REF_MAJOR_MINOR: ${{ steps.ref.outputs.major_minor }}
          REF_MAJOR: ${{ steps.ref.outputs.major }}
          IS_MAIN_REF: ${{ github.ref == 'refs/heads/main' }}
        run: |
          # Suffix derived from composer mode:
          #   pinned  -> '' (bare tags — 8.5.0, 8.5, 8, latest)
          #   rolling -> '-rolling' (8.5.0-rolling, 8.5-rolling, 8-rolling, rolling)
          SUF=""
          LATEST="latest"
          if [ "$COMPOSER_MODE" = "rolling" ]; then
            SUF="-rolling"
            LATEST="rolling"
          fi
          ENABLE_LATEST="false"
          if [ "$IS_RELEASE_FROM_FILE" = "true" ] && [ "$IS_MAIN_REF" = "true" ]; then
            ENABLE_LATEST="true"
          fi
          {
            echo "tags<<__EOF__"
            echo "type=raw,value=${REF_VERSION}${SUF}"
            echo "type=raw,value=${REF_VERSION}${SUF}-${REF_DATE_TAG}"
            echo "type=raw,value=${REF_MAJOR_MINOR}${SUF}"
            echo "type=raw,value=${REF_MAJOR}${SUF}"
            # `latest` (pinned) / `rolling` (rolling-latest) only when the build
            # is from the .snipe-it-version file AND ref is main.
            echo "type=raw,value=${LATEST},enable=${ENABLE_LATEST}"
            echo "type=sha,prefix=sha-${COMPOSER_MODE}-"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Compute image tags (branch-stream)
        if: steps.gate.outputs.skip != 'true' && matrix.track.ref_source != 'file'
        id: tags_branch
        env:
          COMPOSER_MODE: ${{ matrix.composer }}
          TAGS_EXTRA: ${{ matrix.track.tags_extra }}
          REF_VERSION: ${{ steps.ref.outputs.version }}
        run: |
          SUF=""
          if [ "$COMPOSER_MODE" = "rolling" ]; then
            SUF="-rolling"
          fi
          # master / develop builds — branch tags + dated snapshot, no latest/major
          {
            echo "tags<<__EOF__"
            # shellcheck disable=SC2086 # word-split intentional on comma list
            for t in $(echo "$TAGS_EXTRA" | tr ',' ' '); do
              echo "type=raw,value=${t}${SUF}"
            done
            echo "type=raw,value=${REF_VERSION}${SUF}"
            echo "type=sha,prefix=sha-${COMPOSER_MODE}-"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        if: steps.gate.outputs.skip != 'true'
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: ${{ steps.tags_tag.outputs.tags || steps.tags_branch.outputs.tags }}
          labels: |
            org.opencontainers.image.title=snipe-it-php-fpm
            org.opencontainers.image.description=Hardened Snipe-IT ${{ steps.ref.outputs.ref }} on PHP 8.5 / Alpine
            org.opencontainers.image.version=${{ steps.ref.outputs.version }}
            org.opencontainers.image.created=${{ steps.ref.outputs.build_date }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - name: Build (and push if not PR)
        if: steps.gate.outputs.skip != 'true'
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          target: runtime
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SNIPE_IT_VERSION=${{ steps.ref.outputs.ref }}
            BUILD_DATE=${{ steps.ref.outputs.build_date }}
            VCS_REF=${{ github.sha }}
            ROLLING_DEPS=${{ matrix.composer == 'rolling' }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.track.name }}-${{ matrix.composer }}
          cache-to: type=gha,scope=${{ matrix.track.name }}-${{ matrix.composer }},mode=max

      - name: Attest build provenance
        if: steps.gate.outputs.skip != 'true' && github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # ─ Keyless cosign signing ───────────────────────────────────────────
      # Complements the SLSA provenance attestation above with a cosign
      # signature on the image manifest. The two are NOT duplicates:
      #   * `attest-build-provenance` attaches an in-toto SLSA predicate
      #     describing HOW the artefact was built (verifiable via
      #     `gh attestation verify` or `cosign verify-attestation`).
      #   * `cosign sign` attaches an OIDC-bound signature proving WHO/WHAT
      #     workflow signed it (verifiable via `cosign verify` with the
      #     workflow identity / certificate-identity-regexp).
      # Both land in the Rekor transparency log; consumers may pin to
      # either or both depending on their policy engine (Sigstore policy
      # controller, Kyverno, OPA, …).
      - name: Install cosign
        if: steps.gate.outputs.skip != 'true' && github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image with cosign (keyless / OIDC)
        if: steps.gate.outputs.skip != 'true' && github.event_name != 'pull_request'
        env:
          COSIGN_EXPERIMENTAL: '1'
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE_REF"
