upstream snipeit-app {
  # php-fpm listens on a unix socket inside a shared tmpfs volume —
  # see compose.yml `fpm-sock` volume. Closes the FastCGI-bypass risk
  # of TCP listen on the compose-internal network.
  server unix:/run/php-fpm/snipeit.sock;
  keepalive 8;
}

server {
  listen 80 default_server;
  listen [::]:80 default_server;

  root /var/www/html/public;
  index index.php index.html;

  charset utf-8;

  # NOTE: Security headers live in /etc/nginx/snippets/security-headers.conf
  # and are `include`d in EVERY location block below. nginx replaces (does
  # NOT merge) `add_header` directives per location, so a server-level
  # block here would be silently dropped from any location that uses its
  # own add_header (e.g. the static-asset `Cache-Control`). The snippet
  # must be re-included in each location to actually reach the response.

  # In-container health probe — bypass PHP-FPM
  location = /health {
    access_log off;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location = /favicon.ico { access_log off; log_not_found off; }
  location = /robots.txt  { access_log off; log_not_found off; }

  # Block hidden + sensitive paths
  location ~ /\.(?!well-known) { deny all; }
  location ~* \.(env|log|md|json|lock|yml|yaml|sh)$ { deny all; }

  # Laravel front controller
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri $uri/ /index.php?$query_string;
  }

  location ~ \.php$ {
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
    fastcgi_split_path_info ^(.+\.php)(/.+)$;
    fastcgi_pass snipeit-app;
    fastcgi_index index.php;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param PATH_INFO $fastcgi_path_info;
    fastcgi_param HTTP_PROXY "";   # mitigate httpoxy
    fastcgi_read_timeout 300;
    fastcgi_buffer_size 16k;
    fastcgi_buffers 16 16k;
    fastcgi_keep_conn on;
  }

  # Static assets — long cache
  location ~* \.(?:css|js|gif|jpe?g|png|svg|webp|woff2?|ttf|eot|ico)$ {
    include /etc/nginx/snippets/security-headers.conf;
    expires 30d;
    access_log off;
    add_header Cache-Control "public, max-age=2592000, immutable";
    try_files $uri =404;
  }
}
