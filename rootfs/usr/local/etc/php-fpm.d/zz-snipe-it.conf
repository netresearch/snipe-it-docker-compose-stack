; Snipe-IT php-fpm pool overrides
; Loaded after www.conf — keys here override defaults

[www]
user = www-data
group = www-data

; Listen on a unix socket inside a shared tmpfs volume between `app` and
; `web`. Closes the H4 security finding: with TCP listen=0.0.0.0:9000, any
; sibling container on the snipeit network could speak FastCGI directly and
; bypass nginx (SCRIPT_FILENAME injection). With a unix socket, only
; containers that mount the shared `fpm-sock` volume can reach php-fpm —
; that's the actual security boundary, not the file mode.
;
; mode 0666 is intentional: nginx:alpine runs as uid `nginx` (≠ our
; www-data uid), and unix-socket connect() requires write access. 0660
; would force a uid/gid sync across both images, which is fragile across
; base-image bumps. The volume scope (only `app` + `web` mount it) is the
; access-control surface.
listen = /run/php-fpm/snipeit.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0666

pm = dynamic
pm.max_children = 25
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500
pm.status_path = /fpm-status
ping.path = /ping
ping.response = pong

; Catch worker stderr in container stdout
catch_workers_output = yes
decorate_workers_output = no

; clear_env = yes — wipe the process environment before each request. The
; explicit env[…] forwards below give Laravel exactly what it needs; nothing
; else (DB_ROOT_PASSWORD, MAIL_PASSWORD, etc. for OTHER services) leaks into
; the PHP request context where uploaded code could read via getenv().
clear_env = yes
env[APP_KEY] = $APP_KEY
env[APP_URL] = $APP_URL
env[APP_ENV] = $APP_ENV
env[APP_DEBUG] = $APP_DEBUG
env[TZ] = $TZ
env[DB_CONNECTION] = $DB_CONNECTION
env[DB_HOST] = $DB_HOST
env[DB_PORT] = $DB_PORT
env[DB_DATABASE] = $DB_DATABASE
env[DB_USERNAME] = $DB_USERNAME
env[DB_PASSWORD] = $DB_PASSWORD
env[REDIS_HOST] = $REDIS_HOST
env[REDIS_PORT] = $REDIS_PORT
env[REDIS_PASSWORD] = $REDIS_PASSWORD
env[CACHE_DRIVER] = $CACHE_DRIVER
env[SESSION_DRIVER] = $SESSION_DRIVER
env[QUEUE_CONNECTION] = $QUEUE_CONNECTION
env[MAIL_HOST] = $MAIL_HOST
env[MAIL_PORT] = $MAIL_PORT
env[MAIL_USERNAME] = $MAIL_USERNAME
env[MAIL_PASSWORD] = $MAIL_PASSWORD
env[MAIL_ENCRYPTION] = $MAIL_ENCRYPTION
env[MAIL_FROM_ADDR] = $MAIL_FROM_ADDR
env[MAIL_FROM_NAME] = $MAIL_FROM_NAME
env[LOG_CHANNEL] = $LOG_CHANNEL
env[LOG_STDERR_FORMATTER] = $LOG_STDERR_FORMATTER
env[SESSION_SECURE_COOKIE] = $SESSION_SECURE_COOKIE
; Sentry / Bugsink. Empty DSN = SDK auto-discovered but inactive (no
; network calls). clear_env = yes above means these vars must be
; explicitly forwarded or php-fpm workers won't see them.
env[SENTRY_LARAVEL_DSN] = $SENTRY_LARAVEL_DSN
env[SENTRY_TRACES_SAMPLE_RATE] = $SENTRY_TRACES_SAMPLE_RATE
env[SENTRY_PROFILES_SAMPLE_RATE] = $SENTRY_PROFILES_SAMPLE_RATE
env[SENTRY_RELEASE] = $SENTRY_RELEASE
