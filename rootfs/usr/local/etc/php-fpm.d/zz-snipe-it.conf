; Snipe-IT php-fpm pool overrides
; Loaded after www.conf — keys here override defaults

[www]
user = www-data
group = www-data
listen = 0.0.0.0:9000
listen.allowed_clients = any   ; safe — container is only on the compose network

pm = dynamic
pm.max_children = 25
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500
pm.status_path = /fpm-status
ping.path = /ping
ping.response = pong

; Catch worker stderr in container stdout
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
