; Snipe-IT runtime PHP overrides
; Loaded automatically (alphabetical) from /usr/local/etc/php/conf.d/

; --- Resource limits ---
memory_limit = 512M
max_execution_time = 300
max_input_time = 300
post_max_size = 50M
upload_max_filesize = 50M
max_file_uploads = 30

; --- Error reporting (production safe) ---
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2

; --- Sessions ---
session.cookie_httponly = 1
session.cookie_secure = 0  ; flip to 1 when serving via HTTPS (Traefik handles TLS)
session.cookie_samesite = "Lax"
session.use_strict_mode = 1

; --- Date ---
; PHP ini does NOT expand env vars. Setting date.timezone = ${TZ} produces a
; literal string and PHP falls back to UTC with a warning at every request.
; Laravel manages its own timezone via APP_TIMEZONE / config('app.timezone'),
; so a UTC default at the PHP layer is harmless and silent.
date.timezone = UTC

; --- OPcache (production) ---
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1
opcache.fast_shutdown = 1

; --- Realpath cache ---
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; --- Mail ---
sendmail_path = "/usr/sbin/sendmail -t -i"

; --- expose_php off ---
expose_php = Off

; NOTE: disable_functions is intentionally NOT set. Snipe-IT uses Symfony Process
; (which calls proc_open) for backups, PDF generation, and artisan commands invoked
; from the web context. Restrictive disable_functions silently breaks these.
; Defence-in-depth is provided by the non-root www-data user + container isolation.
